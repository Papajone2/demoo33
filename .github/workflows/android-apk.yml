name: Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, build/android-apk-actions]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=4096
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prod=false
      - name: Typecheck Android application
        run: |
          pnpm exec tsc --build lib/api-client-react
          pnpm --filter @workspace/monero2014 run typecheck
      - name: Run regression tests
        id: regression
        continue-on-error: true
        run: node --experimental-strip-types --test artifacts/monero2014/lib/*.test.mjs
      - name: Verify and download native Monero engine
        run: python3 scripts/fetch-monero-engine.py
      - name: Generate Android project
        working-directory: artifacts/monero2014
        run: pnpm exec expo prebuild --platform android --clean --no-install
      - name: Build standalone test-signed APK
        working-directory: artifacts/monero2014/android
        run: |
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,x86_64 \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Porg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m" \
            --max-workers=2 --console=plain
      - name: Verify APK contents and Android signature
        run: |
          mkdir -p generated-artifacts/android
          cp artifacts/monero2014/android/app/build/outputs/apk/release/app-release.apk \
            generated-artifacts/android/monero2014-wallet.apk
          python3 scripts/check-android-apk.py generated-artifacts/android/monero2014-wallet.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify generated-artifacts/android/monero2014-wallet.apk
      - name: Record build limitations
        if: always()
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: |
          {
            echo "## Experimental Android APK"
            echo "Built from commit: $GITHUB_SHA"
            echo "Regression tests: $REGRESSION_OUTCOME"
            echo "This APK uses an Android development signing key, not a production identity."
            echo "No device, funded-transfer, or wallet-security acceptance testing is claimed."
            if [ "$REGRESSION_OUTCOME" = "failure" ]; then
              echo "**Warning:** Regression tests failed. Read the test log before installing."
              echo "The source repository currently lacks username-public.pem, which can affect wallet operations."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK and verification files
        uses: actions/upload-artifact@v4
        with:
          name: monero2014-wallet-apk-${{ github.run_number }}
          path: generated-artifacts/android/
          if-no-files-found: error
          retention-days: 14
